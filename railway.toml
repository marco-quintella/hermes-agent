# Railway config-as-code for Hermes Agent (gateway + dashboard).
# Deploy: push to main → GitHub triggers Railway build (Dockerfile + this file).
# See: https://docs.railway.com/reference/config-as-code

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "gateway run"
restartPolicyType = "ALWAYS"
requiredMountPath = "/opt/data"
# Gateway + dashboard cold start can exceed 10m on first deploy; avoid false FAILED.
healthcheckPath = "/"
healthcheckTimeout = 1800
