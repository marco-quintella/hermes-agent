# Railway config-as-code — aligned with docker.md (dashboard) + lovexbytes (no HTTP healthcheck).
# Deploy: git push main only.
#
# Port (must match in two places):
#   1. PORT below → app listens on this (entrypoint: HERMES_DASHBOARD_PORT or PORT).
#   2. Networking → your domain → Target port (edit icon) → same number (e.g. 9119).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "gateway run"
restartPolicyType = "ON_FAILURE"
requiredMountPath = "/opt/data"
# No healthcheckPath — Railway default PORT probe; dashboard binds $PORT in foreground.

[variables]
# Explicit listen port; must match domain Target port in Railway UI.
PORT = "9119"
HERMES_DASHBOARD = "1"
HERMES_DASHBOARD_HOST = "0.0.0.0"
