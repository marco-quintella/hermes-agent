# Railway config-as-code — aligned with lovexbytes/hermes-railway-template + docker.md.
# Deploy: git push main → GitHub triggers build. No HTTP healthcheck (worker/web stable pattern).
# Dashboard: HERMES_DASHBOARD=1 + PORT fallback in docker/entrypoint.sh.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "gateway run"
restartPolicyType = "ON_FAILURE"
requiredMountPath = "/opt/data"

[variables]
HERMES_DASHBOARD = "1"
HERMES_DASHBOARD_HOST = "0.0.0.0"
